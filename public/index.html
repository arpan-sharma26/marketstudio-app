<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ads Dashboard · Market Studio</title>
<link rel="icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <img src="/assets/logo.png" alt="Market Studio" width="640" height="325">
        <span class="brand-tag">Meta Ads</span>
      </a>
      <div class="topbar-actions">
        <button class="btn btn-quiet" id="refresh" type="button" title="Fetch the latest numbers from Meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span>Refresh</span>
        </button>
        <a class="btn btn-quiet" href="/api/logout">Sign out</a>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="page-head">
      <div>
        <div id="crumb"></div>
        <h1 id="title">All clients</h1>
        <p class="sub" id="subtitle">&nbsp;</p>
      </div>
      <div class="filters">
        <div class="seg" role="group" aria-label="Date range" id="ranges">
          <button type="button" data-range="7">7 days</button>
          <button type="button" data-range="14">14 days</button>
          <button type="button" data-range="30">30 days</button>
          <button type="button" data-range="90">90 days</button>
          <button type="button" data-range="month">This month</button>
          <button type="button" data-range="lastmonth">Last month</button>
          <button type="button" data-range="custom">Custom</button>
        </div>
        <div class="custom-range" id="custom">
          <label class="sr-only" for="since">From</label><input type="date" id="since">
          <span aria-hidden="true">to</span>
          <label class="sr-only" for="until">To</label><input type="date" id="until">
        </div>
      </div>
    </div>
    <div id="view"></div>
    <p class="foot-note" id="foot"></p>
  </main>

<script src="/app.js" type="module"></script>
</body>
</html>
